<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo — chat de NutriBot integrado en una web</title>
  <style>
    body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#1f2a22;background:#f3f6f4}
    nav{display:flex;gap:28px;align-items:center;padding:16px 40px;background:#fff;border-bottom:1px solid #e3e8e4}
    nav b{color:#1b6b2f;font-size:18px}
    main{padding:56px 40px;max-width:700px}
    h1{font-size:32px;margin:0 0 12px;color:#17331f}
    p{color:#6b7770;line-height:1.6}
    code{background:#e8f3ea;padding:2px 6px;border-radius:4px;color:#1b6b2f}
  </style>
</head>
<body>
  <nav><b>BATTILANA NUTRICIÓN</b><span>Productos</span><span>Fichas técnicas</span><span>Contacto</span></nav>
  <main>
    <h1>Página de demostración</h1>
    <p>Simula la web de la empresa. El botón verde de la esquina lo agrega el script
       <code>nutribot.js</code> con una sola línea; el cliente solo puede usar el chat.</p>
  </main>
  <!-- Integracion del chat: esta es la unica linea que se agrega a la web real -->
  <script src="/nutribot.js" defer></script>
</body>
</html>
