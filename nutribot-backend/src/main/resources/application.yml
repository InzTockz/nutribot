spring:
  application:
    name: nutribot-backend

  # ===== Sprint 4: los secretos NO van en el codigo =====
  # Se leen de variables de entorno o del archivo .env (excluido de Git). Ver .env.example.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  # ===== Subida de archivos (HU06: permite PDFs/Word grandes) =====
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # ===== Base de datos MySQL (contenedor Docker, puerto 3307 del host) =====
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/nutribot?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:nutribot}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update        # crea/actualiza tablas a partir de las entidades
    show-sql: true
    open-in-view: false       # buena practica: cierra la sesion JPA tras el servicio
    properties:
      hibernate:
        format_sql: true

  # ===== Spring AI =====
  ai:
    ollama:
      base-url: http://localhost:11434   # Ollama nativo en Windows (GPU)
      chat:
        options:
          model: mistral                 # LLM local
          temperature: 0.3               # bajo = respuestas mas fieles (menos "inventos")
          keep-alive: ${NUTRIBOT_OLLAMA_KEEP_ALIVE:8h}   # DEF-14: Mistral sigue cargado una jornada (por defecto Ollama lo descarga a los 5 min)
          num-ctx: 4096                  # contexto moderado, ideal para 8 GB de VRAM
      embedding:
        options:
          model: nomic-embed-text        # modelo de embeddings (768 dimensiones)
          keep-alive: ${NUTRIBOT_OLLAMA_KEEP_ALIVE:8h}   # DEF-14
          num-gpu: 0                     # embeddings en CPU (~15 ms): evita el crash del runner CUDA y libera VRAM para Mistral
    vectorstore:
      qdrant:
        host: localhost
        port: 6334                       # puerto gRPC de Qdrant
        collection-name: nutribot_docs   # coleccion donde viven los vectores
        initialize-schema: true          # Spring AI crea la coleccion automaticamente
        use-tls: false

server:
  port: 8080
  error:
    include-message: always   # devuelve el mensaje de validacion (ej. formato no permitido) al frontend

logging:
  level:
    org.springframework.ai: INFO

# ===== Configuracion propia de NutriBot =====
nutribot:
  # DEF-14: consulta interna al arrancar para que el primer cliente no espere la carga del modelo
  ollama:
    precalentar: true
  # Sprint 4 (deuda tecnica): memoria de conversacion
  chat:
    memoria-mensajes: 8          # ventana de historial por conversacion (~4 turnos)
    inactividad-minutos: 120     # tras este tiempo sin mensajes se libera la memoria de la conversacion
  # Sprint 4 (enabler de seguridad)
  security:
    jwt-secret: ${NUTRIBOT_JWT_SECRET}          # minimo 32 caracteres
    jwt-horas: ${NUTRIBOT_JWT_HORAS:8}          # duracion de la sesion (una jornada)
    admin-usuario: ${NUTRIBOT_ADMIN_USER:admin}
    admin-password: ${NUTRIBOT_ADMIN_PASSWORD:}  # solo se usa para crear el admin si no existe
    asesor-usuario: ${NUTRIBOT_ASESOR_USER:}
    asesor-password: ${NUTRIBOT_ASESOR_PASSWORD:}
  cors:
    # Origenes que pueden llamar a la API: el panel y, en produccion, la web de Battilana
    allowed-origins: ${NUTRIBOT_CORS_ORIGINS:http://localhost:4200}
  whatsapp:
    advisor-number: "51932996032"   # numero real de Battilana (51 = Peru + 932996032); verificar si es el del asesor
  # DEF-15: horario de atencion de los asesores (lo decide el backend, en hora de Peru; domingo cerrado)
  asesor:
    zona-horaria: America/Lima
    lunes-a-viernes: ${NUTRIBOT_HORARIO_SEMANA:08:00-18:00}
    sabado: ${NUTRIBOT_HORARIO_SABADO:08:00-13:00}
  rag:
    top-k: ${NUTRIBOT_RAG_TOP_K:6}   # Sprint 4: fragmentos que se recuperan de Qdrant por consulta
    similarity-threshold: 0.4   # umbral de similitud RAG; si ningun fragmento lo supera, deriva a un asesor (HU08)
    # Documento con la lista de precios oficial. En consultas de precio la busqueda se restringe
    # a el (metadato "source") para que los fragmentos del FAQ o de las fichas tecnicas no
    # desplacen al bloque del producto (DEF-10). Debe coincidir EXACTAMENTE con el nombre del
    # archivo tal como fue subido en la pestana Administrador.
    price-document: lista-precios-battilana.txt
